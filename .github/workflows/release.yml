name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - name: Build Windows Tauri App
        working-directory: desktop/src-tauri
        run: cargo build --release
      - name: Stage app binary for installer embed
        shell: pwsh
        run: Copy-Item desktop/src-tauri/target/release/bigpocket.exe desktop/BigPocket.exe -Force
      - name: Build Windows Setup Wizard
        working-directory: desktop
        shell: pwsh
        run: |
          go build -ldflags "-H windowsgui -s -w" -o ../BigPocket-Setup.exe installer.go
      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          Copy-Item desktop/src-tauri/target/release/bigpocket.exe BigPocket.exe
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item BigPocket.exe dist/BigPocket.exe
          Copy-Item -Recurse -Force desktop/frontend dist/frontend
          Copy-Item -Recurse -Force desktop/usbmmidd dist/usbmmidd
          Copy-Item -Recurse -Force desktop/VBCABLE dist/VBCABLE
          Copy-Item -Force desktop/logo.ico dist/logo.ico
          Compress-Archive -Path dist/* -DestinationPath bigpocket-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            BigPocket.exe
            BigPocket-Setup.exe
            bigpocket-windows.zip
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli
      - name: Build macOS Tauri Bundle
        working-directory: desktop
        run: tauri build
      - name: Package macOS Artifacts
        run: |
          # Copy DMG bundle if generated
          find desktop/src-tauri/target/release/bundle/dmg -name "*.dmg" -exec cp {} BigPocket.dmg \; 2>/dev/null || true
          # Create compressed archive of .app bundle
          if [ -d desktop/src-tauri/target/release/bundle/macos/BigPocket.app ]; then
            tar -czvf BigPocket-macos.tar.gz -C desktop/src-tauri/target/release/bundle/macos BigPocket.app
          fi
          # Also keep standalone binary
          cp desktop/src-tauri/target/release/bigpocket bigpocket-macos 2>/dev/null || true
          chmod +x bigpocket-macos 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            BigPocket.dmg
            BigPocket-macos.tar.gz
            bigpocket-macos

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev librsvg2-dev patchelf libx11-dev libxdo-dev libxtst-dev libxi-dev libxrandr-dev libasound2-dev libpipewire-0.3-dev libclang-dev libgbm-dev
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli
      - name: Build Linux Tauri Bundle (.deb)
        working-directory: desktop
        run: tauri build --bundles deb
      - name: Package Linux Artifacts
        run: |
          # Copy .deb installer
          find desktop/src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} BigPocket-linux.deb \; 2>/dev/null || true
          # Create universal compressed tar.gz
          tar -czvf BigPocket-linux-x86_64.tar.gz -C desktop/src-tauri/target/release bigpocket
          # Also keep standalone binary
          cp desktop/src-tauri/target/release/bigpocket bigpocket-linux 2>/dev/null || true
          chmod +x bigpocket-linux 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            BigPocket-linux.deb
            BigPocket-linux-x86_64.tar.gz
            bigpocket-linux

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
      - name: Build APK
        working-directory: android
        env:
          BP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk ../BigPocket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: BigPocket.apk

  release:
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Extract notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md || true
      - name: Generate checksums
        run: |
          sha256sum BigPocket.exe bigpocket-windows.zip BigPocket.apk *macos* *linux* > SHA256SUMS.txt 2>/dev/null || sha256sum *.* > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BigPocket ${{ github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            BigPocket-Setup.exe
            BigPocket.exe
            bigpocket-windows.zip
            BigPocket.dmg
            BigPocket-macos.tar.gz
            bigpocket-macos
            BigPocket-linux.deb
            BigPocket-linux-x86_64.tar.gz
            bigpocket-linux
            BigPocket.apk
            SHA256SUMS.txt
