name: Release

# Push a tag like "v1.2.0" -> builds Windows + Android and publishes a GitHub Release.
# The release body (update notes shown inside the apps) is taken from CHANGELOG.md's
# section for that version, or auto-generated if missing.
#
# Required repository secrets for a signed APK (needed so in-app updates install over
# the existing app):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - name: Build
        working-directory: desktop
        run: |
          go build -ldflags "-H windowsgui -s -w" -o dist/BigPocket.exe main.go updater.go discovery.go
          Copy-Item -Recurse frontend dist/frontend
          Compress-Archive -Path dist/* -DestinationPath ../bigpocket-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: bigpocket-windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode keystore
        if: env.KS != ''
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > android/app/release.jks
      - name: Build APK
        working-directory: android
        env:
          BP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk ../bigpocket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: bigpocket.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Extract notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md || true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: |
            bigpocket-windows.zip
            bigpocket.apk
