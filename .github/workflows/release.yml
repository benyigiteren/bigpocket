name: Release

# Push a tag like "v1.2.0" -> builds Windows (portable zip + single-file Setup) and
# Android, then publishes a GitHub Release with SHA256SUMS.txt.
# The release body (update notes shown inside the apps) is taken from CHANGELOG.md's
# section for that version, or auto-generated if missing.
#
# Required repository secrets for a signed APK (needed so in-app updates install over
# the existing app):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the Gradle build falls back to the Android debug keystore.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - name: Build portable app
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # `.` compiles every package-main .go file in desktop/ (main.go, win32_native.go,
          # qrcode_gen.go, security.go, updater.go, discovery.go, ...).
          go build -ldflags "-H windowsgui -s -w" -o dist/BigPocket.exe .
          # installer.go embeds BigPocket.exe from desktop/, so keep a copy next to it.
          Copy-Item -Force dist/BigPocket.exe BigPocket.exe
          Copy-Item -Recurse -Force frontend dist/frontend
          Copy-Item -Recurse -Force usbmmidd dist/usbmmidd
          Copy-Item -Recurse -Force VBCABLE dist/VBCABLE
          Copy-Item -Force logo.ico dist/logo.ico
          Compress-Archive -Path dist/* -DestinationPath ../bigpocket-windows.zip -Force
      - name: Build single-file installer
        working-directory: desktop
        shell: pwsh
        run: go build -ldflags "-H windowsgui -s -w" -o ../bigpocket-windows.exe installer.go
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            bigpocket-windows.zip
            bigpocket-windows.exe

  android:
    runs-on: ubuntu-latest
    env:
      # The secret is hoisted to job level on purpose: the `env` context is
      # available inside a step-level `if:`, while the `secrets` context is not
      # (see "Context availability" in the GitHub Actions contexts reference).
      # The previous per-step `env: KS:` could never be read by that step's own
      # `if: env.KS != ''`, so the keystore was never decoded.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
      - name: Build APK
        working-directory: android
        env:
          BP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk ../bigpocket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: bigpocket.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Extract notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md || true
      - name: Generate checksums
        run: |
          sha256sum bigpocket-windows.zip bigpocket-windows.exe bigpocket.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: |
            bigpocket-windows.zip
            bigpocket-windows.exe
            bigpocket.apk
            SHA256SUMS.txt
