[package]
name = "bigpocket"
version = "1.5.3"
description = "BigPocket Control Panel & Stream Deck Desktop Server"
authors = ["benyigiteren"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tower = { version = "0.4", features = ["util"] }
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
xcap = "0.9"
enigo = { version = "0.2" }
sysinfo = "0.31"
windows = { version = "0.57", features = ["Media_Control", "Storage_Streams", "Foundation"] }
# `flate2` is pinned to the pure-Rust (miniz_oxide) backend so `zip`'s
# `deflate-flate2` feature compiles without a C toolchain; it is a direct dep
# only to select that backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
[profile.release]
strip = true
