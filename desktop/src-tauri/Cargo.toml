[package]
name = "bigpocket"
version = "1.5.4"
description = "BigPocket Control Panel & Stream Deck Desktop Server"
authors = ["benyigiteren"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tower = { version = "0.4", features = ["util"] }
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
xcap = "0.9"
enigo = { version = "0.2" }
sysinfo = "0.31"
# Cross-platform clipboard and desktop notifications. Only the macOS/Linux
# branches call into them — Windows keeps its own Win32 implementations — but
# both crates build everywhere, so they are declared normally.
arboard = "3"
notify-rust = "4"
# Advisory file lock behind the non-Windows single-instance guard in main.rs.
fs2 = "0.4"
# `flate2` is pinned to the pure-Rust (miniz_oxide) backend so `zip`'s
# `deflate-flate2` feature compiles without a C toolchain; it is a direct dep
# only to select that backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Cache keys for extracted application icons (see `icon_extractor.rs`).
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# WinRT/Win32 bindings (GSMTC media sessions, storage streams). Windows-only:
# keeping it out of the shared table avoids compiling the bindings — and the
# several `windows-*` crates it pulls in — for macOS/Linux builds.
#
# The Win32 feature list is what `icon_extractor.rs` needs: the shell
# (`SHGetFileInfoW`, `SHGetImageList`), the jumbo image list it returns, user32's
# icon drawing, GDI's DIB sections and COM initialisation for the image list.
windows = { version = "0.57", features = [
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
