<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#09090C"/>
    </linearGradient>

    <!-- Phone Screen / Accent Gradient -->
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Pocket Interior Shadow -->
    <linearGradient id="pocketFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E26"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas (App Icon) -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#bgGrad)" stroke="#272730" stroke-width="2"/>

  <!-- Phone inserted into the pocket (Upper Part) -->
  <rect x="44" y="20" width="40" height="48" rx="8" ry="8" fill="url(#phoneGrad)" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Phone Speaker / Camera Notch -->
  <rect x="56" y="25" width="16" height="3" rx="1.5" ry="1.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Pocket Body (Lower Part with crisp silhouette) -->
  <path d="M34 48 L34 70 C34 90, 48 100, 64 100 C80 100, 94 90, 94 70 L94 48 Z" 
        fill="url(#pocketFill)" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Top Pocket Rim Lip (White Bold Bar) -->
  <line x1="28" y1="48" x2="100" y2="48" 
        stroke="#FFFFFF" 
        stroke-width="6" 
        stroke-linecap="round"/>

  <!-- Pocket Decorative Accent Seam (Electric Lavender) -->
  <path d="M44 60 C44 76, 52 86, 64 86 C76 86, 84 76, 84 60" 
        fill="none" 
        stroke="#C084FC" 
        stroke-width="3.5" 
        stroke-linecap="round"/>

  <!-- Center Connection Dot (Signifying active wireless link) -->
  <circle cx="64" cy="73" r="4" fill="#FFFFFF"/>
</svg>
