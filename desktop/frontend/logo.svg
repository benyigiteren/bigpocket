<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="32" ry="32" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2.5"/>

  <!-- Subtle glow -->
  <circle cx="64" cy="56" r="32" fill="#818cf8" opacity="0.12" filter="blur(16px)"/>

  <!-- Modern Pocket Body -->
  <path d="M38 42 H90 C90 42 90 74 64 92 C38 74 38 42 38 42 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Top Pocket Rim -->
  <line x1="34" y1="42" x2="94" y2="42" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        stroke-linecap="round"/>

  <!-- Modern Inner Pocket Seam / Signal Curve -->
  <path d="M48 54 H80 C80 54 80 70 64 80 C48 70 48 54 48 54 Z" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Center Connection Dot (Signifying PC-Phone sync) -->
  <circle cx="64" cy="65" r="4.5" fill="url(#accentGrad)"/>
</svg>
